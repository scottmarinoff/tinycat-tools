xploration of reality that remains essential reading for anyone interested in the philosophical foundations of physics.","footnotes":["F. David Peat, Physics Today, 1981","Basil Hiley, Foundations of Physics, 1982"],"related":[{"title":"The Tao of Physics","author":"Fritjof Capra","reason":"Similarly explores parallels between modern physics and Eastern mysticism."},{"title":"Science, Order, and Creativity","author":"David Bohm and F. David Peat","reason":"A later collaboration that further develops Bohm's ideas about creativity and the implicate order."},{"title":"The Holographic Universe","author":"Michael Talbot","reason":"Popularizes Bohm's holographic model and its implications for consciousness and reality."}]};
