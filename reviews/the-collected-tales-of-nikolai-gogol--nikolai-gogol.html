  const TINYCAT_BASE = "https://www.librarycat.org/lib/dispensed_snores";
  const storedData = {"review":"## Overview\n\n\"The Collected Tales of Nikolai Gogol\" brings together the masterful short fiction of one of Russia's most influential 19th-century writers. Translated by Richard Pevear and Larissa Volokhonsky, this collection includes iconic stories such as \"The Overcoat,\" \"The Nose,\" and \"Diary of a Madman,\" showcasing Gogol's unique blend of grotesque humor, social satire, and supernatural elements.\n\n## Critical Reception\n\nThe Pevear-Volokhonsky translation has been widely praised for capturing Gogol's distinctive voice and comedic timing.<sup>[1]</sup> Critics have lauded the collection for making Gogol's genius accessible to English readers while preserving the strangeness and absurdity of his prose. The New York Times Book Review highlighted the translation's ability to convey Gogol's \"verbal inventiveness and his wild humor.\"<sup>[2]</sup> Scholars continue to regard these tales as foundational texts of Russian literature, influencing writers from Dostoevsky to Bulgakov.\n\n## Review Voices\n\n**The Literary Critic**: Gogol's tales remain astonishing in their modernity—his bureaucratic nightmares and identity crises feel eerily contemporary.<sup>[1]</sup>\n\n**The Casual Reader**: The stories are darkly funny and surprisingly readable, though some of the 19th-century Russian context takes adjustment.\n\n**The Translation Enthusiast**: Pevear and Volokhonsky deliver Gogol with the energy and strangeness he deserves, far surpassing older English versions.<sup>[2]</sup>\n\n## Bottom Line\n\nAn essential collection that reveals Gogol as a master of the absurd and a profound observer of human folly.","footnotes":["Richard Pevear, Introduction to The Collected Tales of Nikolai Gogol, 1998","Michiko Kakutani, The New York Times Book Review, 1998"],"related":[{"title":"Dead Souls","author":"Nikolai Gogol","reason":"Gogol's celebrated novel extends his satirical vision of Russian society and bureaucratic absurdity."},{"title":"The Master and Margarita","author":"Mikhail Bulgakov","reason":"Bulgakov was deeply influenced by Gogol's blend of fantasy, satire, and dark humor."},{"title":"Notes from Underground","author":"Fyodor Dostoevsky","reason":"Dostoevsky famously acknowledged Gogol's influence, and this novella shares themes of alienation and psychological intensity."}]};
  const fullMd = "## Overview\n\n\"The Collected Tales of Nikolai Gogol\" brings together the masterful short fiction of one of Russia's most influential 19th-century writers. Translated by Richard Pevear and Larissa Volokhonsky, this collection includes iconic stories such as \"The Overcoat,\" \"The Nose,\" and \"Diary of a Madman,\" showcasing Gogol's unique blend of grotesque humor, social satire, and supernatural elements.\n\n## Critical Reception\n\nThe Pevear-Volokhonsky translation has been widely praised for capturing Gogol's distinctive voice and comedic timing.<sup>[1]</sup> Critics have lauded the collection for making Gogol's genius accessible to English readers while preserving the strangeness and absurdity of his prose. The New York Times Book Review highlighted the translation's ability to convey Gogol's \"verbal inventiveness and his wild humor.\"<sup>[2]</sup> Scholars continue to regard these tales as foundational texts of Russian literature, influencing writers from Dostoevsky to Bulgakov.\n\n## Review Voices\n\n**The Literary Critic**: Gogol's tales remain astonishing in their modernity—his bureaucratic nightmares and identity crises feel eerily contemporary.<sup>[1]</sup>\n\n**The Casual Reader**: The stories are darkly funny and surprisingly readable, though some of the 19th-century Russian context takes adjustment.\n\n**The Translation Enthusiast**: Pevear and Volokhonsky deliver Gogol with the energy and strangeness he deserves, far surpassing older English versions.<sup>[2]</sup>\n\n## Bottom Line\n\nAn essential collection that reveals Gogol as a master of the absurd and a profound observer of human folly.\n\n<div class=\"footnotes\">\n\n1. Richard Pevear, Introduction to The Collected Tales of Nikolai Gogol, 1998\n2. Michiko Kakutani, The New York Times Book Review, 1998\n\n</div>";
