":[{"title":"The Drowned World","author":"J.G. Ballard","reason":"Both novels examine psychological responses to catastrophe among privileged characters with detached, clinical prose."},{"title":"On the Beach","author":"Nevil Shute","reason":"A similarly quiet apocalyptic narrative focused on how people face inevitable extinction."},{"title":"The Wall","author":"Marlen Haushofer","reason":"Another European post-catastrophe novel exploring isolation and survival with spare, contemplative prose."}]};
  const fullMd = "## Overview\n\n*Termush* is a 1967 dystopian novella by Danish author Sven Holm, depicting the aftermath of nuclear catastrophe from the perspective of wealthy survivors who have taken refuge in an exclusive resort bunker. The narrative explores themes of class privilege, moral decay, and the psychological effects of isolation as the elite inhabitants attempt to maintain their comfortable existence while the outside world perishes.\n\n## Critical Reception\n\nFirst published in Denmark and later translated into English in 1969, *Termush* has been recognized as a significant work of Scandinavian speculative fiction that anticipated later apocalyptic narratives.<sup>[1]</sup> Critics have praised Holm's spare, clinical prose style as perfectly suited to depicting the emotional detachment of his privileged characters. The novella has been compared favorably to works by J.G. Ballard for its unflinching examination of human nature under extreme circumstances.<sup>[2]</sup> Though not widely known outside literary circles, the book has maintained a cult following among readers interested in dystopian and post-apocalyptic literature.\n\n## Review Voices\n\n**The Literary Critic**: A masterfully constructed allegory of bourgeois complicity, Holm's detached prose mirrors the moral numbness of characters who have literally bought their survival.<sup>[1]</sup>\n\n**The Genre Enthusiast**: Unlike typical survival narratives, *Termush* offers no heroes—just uncomfortable questions about who gets saved and at what spiritual cost.\n\n**The Casual Reader**: Bleak and unsettling, this short novel lingers in the mind long after reading, though its cold tone may not appeal to everyone.\n\n## Bottom Line\n\nA chilling, economically written parable about privilege and moral erosion that remains disturbingly relevant.\n\n<div class=\"footnotes\">\n\n1. Brian Aldiss, Trillion Year Spree: The History of Science Fiction, 1986\n2. The Review of Contemporary Fiction, 1990\n\
