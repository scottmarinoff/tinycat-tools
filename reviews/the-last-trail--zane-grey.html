irst book in the Ohio River Trilogy, featuring the same frontier setting and Zane family characters."},{"title":"The Deerslayer","author":"James Fenimore Cooper","reason":"A foundational American frontier novel with similar themes of wilderness survival and Native American encounters."},{"title":"The Big Sky","author":"A.B. Guthrie Jr.","reason":"Another classic Western frontier novel exploring the American wilderness experience with vivid landscape descriptions."}]};
