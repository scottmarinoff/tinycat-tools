<script>
  const TINYCAT_BASE = "https://www.librarycat.org/lib/dispensed_snores";
  const storedData = {"review":"## Overview\n\n*Wuthering Heights* is Emily Brontë's only novel, published in 1847, telling the dark and passionate story of Heathcliff and Catherine Earnshaw on the Yorkshire moors. Through an intricate narrative structure involving multiple narrators, the novel explores obsessive love, revenge, social class, and the destructive nature of thwarted passion across two generations.\n\n## Critical Reception\n\nUpon its initial publication, *Wuthering Heights* received mixed reviews, with many Victorian critics finding it excessively brutal and morally ambiguous.<sup>[1]</sup> The novel was often overshadowed by Charlotte Brontë's *Jane Eyre*, published the same year, and Emily's singular work was considered too wild and strange for contemporary tastes. However, by the early twentieth century, critics began to reassess its literary merit, with scholars recognizing its innovative narrative technique and psychological depth.<sup>[2]</sup> Today it is considered one of the greatest novels in the English language, praised for its poetic intensity and exploration of human nature's darker dimensions. Modern readers continue to debate whether Heathcliff is a romantic hero or a villain, contributing to the novel's enduring fascination.\n\n## Review Voices\n\n**The Literary Critic**: Brontë's ambitious frame narrative and use of unreliable narrators anticipate modernist techniques, making this far more than a simple romance.<sup>[2]</sup>\n\n**The Romantic Reader**: The all-consuming passion between Heathcliff and Catherine remains one of literature's most intense and haunting love stories, impossible to forget.\n\n**The Gothic Enthusiast**: The windswept moors, supernatural hints, and atmosphere of decay create a perfectly unsettling Gothic masterpiece.\n\n**The Skeptical Reader**: The characters can feel cruel and unsympathetic, making emotional connection difficult despite the undeniable power of the prose.\n\n## Bottom Line\n\nA fierce, uncompromising masterpiece that burns with passionate intensity and rewards readers willing to embrace its darkness.","footnotes":["Anonymous Review, The Examiner, 1848","Lord David Cecil, Early Victorian Novelists, 1934"],"related":[{"title":"Jane Eyre","author":"Charlotte Brontë","reason":"Written by Emily's sister in the same year, sharing Gothic elements and exploring passionate love against social constraints."},{"title":"Rebecca","author":"Daphne du Maurier","reason":"A Gothic romance with brooding atmosphere, obsessive love, and a mysterious estate that echoes Wuthering Heights."},{"title":"The Tenant of Wildfell Hall","author":"Anne Brontë","reason":"Another Brontë sister's exploration of destructive relationships and female resilience in Victorian England."}]};
  const fullMd = "## Overview\n\n*Wuthering Heights* is Emily Brontë's only novel, published in 1847, telling the dark and passionate story of Heathcliff and Catherine Earnshaw on the Yorkshire moors. Through an intricate narrative structure involving multiple narrators, the novel explores obsessive love, revenge, social class, and the destructive nature of thwarted passion across two generations.\n\n## Critical Reception\n\nUpon its initial publication, *Wuthering Heights* received mixed reviews, with many Victorian critics finding it excessively brutal and morally ambiguous.<sup>[1]</sup> The novel was often overshadowed by Charlotte Brontë's *Jane Eyre*, published the same year, and Emily's singular work was considered too wild and strange for contemporary tastes. However, by the early twentieth century, critics began to reassess its literary merit, with scholars recognizing its innovative narrative technique and psychological depth.<sup>[2]</sup> Today it is considered one of the greatest novels in the English language, praised for its poetic intensity and exploration of human nature's darker dimensions. Modern readers continue to debate whether Heathcliff is a romantic hero or a villain, contributing to the novel's enduring fascination.\n\n## Review Voices\n\n**The Literary Critic**: Brontë's ambitious frame narrative and use of unreliable narrators anticipate modernist techniques, making this far more than a simple romance.<sup>[2]</sup>\n\n**The Romantic Reader**: The all-consuming passion between Heathcliff and Catherine remains one of literature's most intense and haunting love stories, impossible to forget.\n\n**The Gothic Enthusiast**: The windswept moors, supernatural hints, and atmosphere of decay create a perfectly unsettling Gothic masterpiece.\n\n**The Skeptical Reader**: The characters can feel cruel and unsympathetic, making emotional connection difficult despite the undeniable power of the prose.\n\n## Bottom Line\n\nA fierce, uncompromising masterpiece that burns with passionate intensity and rewards readers willing to embrace its darkness.\n\n<div class=\"footnotes\">\n\n1. Anonymous Review, The Examiner, 1848\n2. Lord David Cecil, Early Victorian Novelists, 1934\n\n</div>";
