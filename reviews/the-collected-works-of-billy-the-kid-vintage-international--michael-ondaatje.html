cted Works of Billy the Kid*, House of Anansi Press, 1970"],"related":[{"title":"Slaughterhouse-Five","author":"Kurt Vonnegut","reason":"Another genre-blending work that uses fragmented narrative to explore violence and trauma."},{"title":"In the American West","author":"Richard Avedon","reason":"A photographic exploration of Western mythology that shares Ondaatje's interest in deconstructing frontier iconography."},{"title":"Blood Meridian","author":"Cormac McCarthy","reason":"A brutally poetic reimagining of the American West that similarly explores violence as a fundamental force."}]};
