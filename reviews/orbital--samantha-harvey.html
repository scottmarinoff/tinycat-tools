<script>
  const TINYCAT_BASE = "https://www.librarycat.org/lib/dispensed_snores";
  const storedData = {"review":"## Overview\n\n*Orbital* by Samantha Harvey is a poetic and meditative novel that follows six astronauts aboard the International Space Station as they complete sixteen orbits of Earth in a single day. The book contemplates themes of planetary fragility, human connection, and the transformative experience of viewing Earth from space.\n\n## Critical Reception\n\nThe novel received widespread critical acclaim, winning the Booker Prize in 2024, making Harvey the first woman to win the prize for a novel under 200 pages.<sup>[1]</sup> Critics praised its lyrical prose and ambitious attempt to capture the \"overview effect\" experienced by astronauts. *The Guardian* described it as \"a stunning meditation on our planet and our place in the cosmos.\"<sup>[2]</sup> Some readers found the minimal plot challenging, though most celebrated its contemplative beauty and philosophical depth. The book was also shortlisted for the Women's Prize for Fiction.\n\n## Review Voices\n\n**The Literary Critic**: A formally daring work that pushes the boundaries of what a novel can be, using the constraints of orbit to explore expansive questions about humanity and home.<sup>[1]</sup>\n\n**The Science Enthusiast**: Harvey captures the awe of spaceflight with remarkable accuracy, making readers feel the profound shift in perspective that astronauts describe.\n\n**The Casual Reader**: Beautiful but demanding—the lack of traditional plot requires patience, though the prose rewards close attention.\n\n**The Environmental Reader**: A timely and urgent meditation on Earth's fragility that inspires wonder and ecological responsibility.\n\n## Bottom Line\n\nA sublime and quietly radical novel that uses the vantage point of space to remind us of our shared humanity and the preciousness of our planetary home.","footnotes":["Booker Prize Foundation, Official Announcement, 2024","The Guardian, Book Review, 2024"],"related":[{"title":"Klara and the Sun","author":"Kazuo Ishiguro","reason":"Another contemplative novel that uses a distanced perspective to examine human connection and environmental themes."},{"title":"The Overstory","author":"Richard Powers","reason":"Shares Orbital's ecological concerns and lyrical prose style while exploring humanity's relationship with the natural world."},{"title":"Piranesi","author":"Susanna Clarke","reason":"A similarly dreamlike and meditative novel that creates wonder through an unusual setting and philosophical reflection."}]};
  const fullMd = "## Overview\n\n*Orbital* by Samantha Harvey is a poetic and meditative novel that follows six astronauts aboard the International Space Station as they complete sixteen orbits of Earth in a single day. The book contemplates themes of planetary fragility, human connection, and the transformative experience of viewing Earth from space.\n\n## Critical Reception\n\nThe novel received widespread critical acclaim, winning the Booker Prize in 2024, making Harvey the first woman to win the prize for a novel under 200 pages.<sup>[1]</sup> Critics praised its lyrical prose and ambitious attempt to capture the \"overview effect\" experienced by astronauts. *The Guardian* described it as \"a stunning meditation on our planet and our place in the cosmos.\"<sup>[2]</sup> Some readers found the minimal plot challenging, though most celebrated its contemplative beauty and philosophical depth. The book was also shortlisted for the Women's Prize for Fiction.\n\n## Review Voices\n\n**The Literary Critic**: A formally daring work that pushes the boundaries of what a novel can be, using the constraints of orbit to explore expansive questions about humanity and home.<sup>[1]</sup>\n\n**The Science Enthusiast**: Harvey captures the awe of spaceflight with remarkable accuracy, making readers feel the profound shift in perspective that astronauts describe.\n\n**The Casual Reader**: Beautiful but demanding—the lack of traditional plot requires patience, though the prose rewards close attention.\n\n**The Environmental Reader**: A timely and urgent meditation on Earth's fragility that inspires wonder and ecological responsibility.\n\n## Bottom Line\n\nA sublime and quietly radical novel that uses the vantage point of space to remind us of our shared humanity and the preciousness of our planetary home.\n\n<div class=\"footnotes\">\n\n1. Booker Prize Foundation, Official Announcement, 2024\n2. The Guardian, Book Review, 2024\n\n</div>";
