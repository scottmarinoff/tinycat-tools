se of place.","footnotes":["Kenneth Budd, *The Last Victorian: R.D. Blackmore and His Novels*, 1960","Sally Shuttleworth, Introduction to Oxford World's Classics edition of *Lorna Doone*, 1989"],"related":[{"title":"Tess of the d'Urbervilles","author":"Thomas Hardy","reason":"Another Victorian novel deeply rooted in the English rural landscape with tragic romantic elements."},{"title":"Ivanhoe","author":"Sir Walter Scott","reason":"A classic historical romance combining adventure, love, and historical conflict in a similar vein."},{"title":"Kidnapped","author":"Robert Louis Stevenson","reason":"A Victorian adventure novel set against historical rebellion with a strong sense of regional identity."}]};
  const fullMd = "## Overview\n\n*Lorna Doone: A Romance of Exmoor* is a historical novel by R.D. Blackmore, first published in 1869, set in 17th-century Devon and Somerset during the Monmouth Rebellion. The story follows John Ridd, a farmer who falls in love with Lorna Doone, a member of the notorious outlaw Doone clan, weaving together romance, adventure, and vivid depictions of the English countryside.\n\n## Critical Reception\n\nUpon its initial publication, *Lorna Doone* received modest attention, but it gained immense popularity after its fourth edition in 1870 and became one of the best-selling novels of the Victorian era.<sup>[1]</sup> Critics have praised Blackmore's evocative descriptions of Exmoor's landscape, which many consider as much a character as any human figure in the novel. The book has been celebrated for its blending of romantic adventure with historical detail, though some modern critics find its pacing leisurely by contemporary standards.<sup>[2]</sup> It has remained continuously in print for over 150 years, demonstrating its enduring appeal to readers. The novel is often credited with establishing Exmoor as a literary destination.\n\n## Review Voices\n\n**The Literary Historian**: A masterful example of Victorian regional fiction that captures both the lawlessness of the era and the beauty of the English West Country.<sup>[1]</sup>\n\n**The Romance Reader**: John and Lorna's love story remains genuinely affecting, with emotional stakes that feel earned despite the melodramatic plot twists.\n\n**The Modern Skeptic**: While beautifully written, the novel demands patience; its dialect passages and lengthy digressions can test contemporary readers.\n\n**The Nature Enthusiast**: Blackmore's prose transforms Exmoor into a living, breathing presence that rivals Hardy's Wessex in atmospheric power.\n\n## Bottom Line\n\nA sweeping Victorian romance that rewards patient readers with rich prose, memorable characters, and an indelible sense of place.\n\n<div class=\"footnotes\">\n\n1. Kenneth Budd, *The Last Victorian: R.D. Blackmore and His Novels*, 1960\n2. Sally Shuttleworth, Introduction to Oxford World's Classics edition of *Lorna Doone*, 1989\n\n</div>";
